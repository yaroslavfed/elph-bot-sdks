name: SDK CI and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*', 'go/v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current package versions to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn test

  publish-npm:
    name: Publish npm packages
    needs: [go, typescript]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        working-directory: typescript
    env:
      YARN_NPM_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          core_version="$(node -p "require('./packages/core/package.json').version")"
          nestjs_version="$(node -p "require('./packages/nestjs/package.json').version")"
          test "$version" = "$core_version"
          test "$version" = "$nestjs_version"
      - name: Publish packages
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          npm_tag=latest
          if [[ "$version" == *-* ]]; then npm_tag=next; fi
          yarn workspace @yaroslavfed/bot-sdk npm publish --access public --tag "$npm_tag"
          yarn workspace @yaroslavfed/bot-sdk-nestjs npm publish --access public --tag "$npm_tag"

  github-release:
    name: Create GitHub Release
    needs: [go, typescript]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/go/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
